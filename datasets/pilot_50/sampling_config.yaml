pipelines:
  # --- Canonical VerifiQuant runs (V3 FIC cards = cards_v3.db) ---
  # These are the numbers reported in the paper main table. db_path pins the
  # patched V3 card store so the result is reproducible.
  vq_flash_v3:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    top_k: 4
    description: VerifiQuant full pipeline, Flash 2.5, K=3, V3 cards (canonical)
  vq_pro_v3:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-pro
    selector_model: gemini-2.5-pro
    extractor_model: gemini-2.5-pro
    oracle_model: gemini-2.5-pro
    max_turns: 3
    top_k: 4
    description: VerifiQuant full pipeline, Pro 2.5, K=3, V3 cards (canonical)
  # --- Ablation: O-ITL turn budget on canonical V3 cards + Flash ---
  # K=3 (default) = vq_flash_v3 above. K=1 = no oracle correction (w/o O-ITL).
  vq_flash_v3_k1:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 1
    top_k: 4
    description: Ablation — VerifiQuant Flash V3 w/o O-ITL (K=1, no oracle correction)
  vq_flash_v3_k2:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 2
    top_k: 4
    description: Ablation — VerifiQuant Flash V3 w/ O-ITL x1 (K=2, oracle corrects <=1x)
  # --- Variance check: canonical VQ Flash V3 config repeated 3x (LLM nondeterminism) ---
  # Distinct names -> distinct result dirs; the canonical vq_flash_v3 is NOT overwritten.
  vq_flash_v3_var1:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    top_k: 4
    description: Variance run 1 — same config as canonical vq_flash_v3
  vq_flash_v3_var2:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    top_k: 4
    description: Variance run 2 — same config as canonical vq_flash_v3
  vq_flash_v3_var3:
    type: verifiquant
    db_path: fic/cards_v3.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    top_k: 4
    description: Variance run 3 — same config as canonical vq_flash_v3
  # --- Supplementary VerifiQuant runs (V1 FIC cards = cards.db, unpatched) ---
  vq_flash:
    type: verifiquant
    db_path: fic/cards.db
    judge_model: gemini-2.5-flash
    selector_model: gemini-2.5-flash
    extractor_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    top_k: 4
    description: VerifiQuant full pipeline, Flash 2.5, K=3, V1 cards (supplementary)
  vq_pro:
    type: verifiquant
    db_path: fic/cards.db
    judge_model: gemini-2.5-pro
    selector_model: gemini-2.5-pro
    extractor_model: gemini-2.5-pro
    oracle_model: gemini-2.5-pro
    max_turns: 3
    top_k: 4
    description: VerifiQuant full pipeline, Pro 2.5, K=3, V1 cards (supplementary)
  cot_single_shot_flash:
    type: cot
    cot_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 1
    description: CoT single-shot, Flash 2.5, no self-improve
  cot_single_shot_pro:
    type: cot
    cot_model: gemini-2.5-pro
    oracle_model: gemini-2.5-pro
    max_turns: 1
    description: CoT single-shot, Pro 2.5, no self-improve
  cot_basic_oracle_flash:
    type: cot
    cot_model: gemini-2.5-flash
    oracle_model: gemini-2.5-flash
    max_turns: 3
    description: CoT + basic oracle self-improve, Flash 2.5, ≤2 corrections
  jpmorgan:
    type: jpmorgan_reimpl
    description: JP Morgan MAS reimplementation — run separately
    note: See reimplementation-jpmorgan/ directory
output_jsonl: results/paper_v1/questions_50.jsonl
run_dir: results/paper_v1
